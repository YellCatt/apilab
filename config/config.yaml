service:
  # 服务名，作为上报事件的 service_name 写入采集端，多服务共用一个采集端时据此区分来源
  name: apilab

server:
  port: 8084

database:
  path: ./data.db

log:
  path: ./logs
  # 设为 debug 可打开请求级调试日志（含 SQL、缓冲状态、采样异常等），上线前改回 info
  level: debug
  # 输出模式：single=全部写入 app.log（默认） / split=按级别分文件互不重叠 / range=按级别分文件含该级别及以上
  mode: single
  # 级别白名单，非空时优先于 level，例如 [warn, error]
  levels: []
  # 是否关闭控制台输出，容器场景日志已交给 stdout 收集时可设为 true
  disable_console: false

collector:
  url: http://localhost:8086/api/traces/report
  # 缓冲达到该数量即触发一次批量上报。调小可让事件更快送达、缓冲占用更低，
  # 代价是请求次数变多；采集端吞吐足够时建议保持在 100 这一档。
  batch_size: 100
  flush_interval: 30s
